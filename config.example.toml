# Limesh 示例配置(Phase 0)
#
# 用法:
#   mesh node -c config.example.toml
#
# 配置优先级(后者覆盖前者):
#   默认值 < 文件字段 < [cli] 块 < 环境变量(MESH_*) < 命令行
#
# 完整配置参考见 docs/CONFIG.md。

# ---------------------------------------------------------------------------
# 顶层元字段(合并期求值,无运行时响应级别)
# ---------------------------------------------------------------------------

# 引用其它配置文件。相对路径基于当前文件所在目录解析。
# include = ["conf.d/*.toml", "secrets/*.toml"]

# 清空指定字段从低优先级来源继承的值。
# 裸写 [] 不清空(仅追加零个元素),必须用 reset。
# reset = ["listen", "peers"]

# ---------------------------------------------------------------------------
# 网络身份
# ---------------------------------------------------------------------------

[network]
# 网络名称。同一网络内的节点必须一致。
name = "prod"

# 网络密钥。生产环境请放入 secrets/*.toml 并设为 0600。
# secret = "please-change-me"

# 本节点主机名。留空则取系统 hostname。
hostname = "node-a"

# ---------------------------------------------------------------------------
# 监听(可多个)
# ---------------------------------------------------------------------------

[[listen]]
# 监听地址。Phase 0 仅支持 udp:// 与 tcp://。
addr = "udp://0.0.0.0:11010"

# ---------------------------------------------------------------------------
# 对端
# ---------------------------------------------------------------------------

# 静态对端列表,格式 host:port。
# 数组按"追加"规则合并:多文件配置会拼接而非替换。
peers = []

# ---------------------------------------------------------------------------
# 接入层(TUN 虚拟网卡)
# ---------------------------------------------------------------------------
# 完整说明见 docs/CONFIG.md 6.4 与 AGENTS.md 12 章。

[ingress]
# 接入模式:
#   tun    内核 TUN 设备,完整三层,需要 CAP_NET_ADMIN 或 root
#   no-tun 用户态协议栈,零权限(Phase 3 实现)
#   auto   优先 tun,权限不足时提示降级
mode = "auto"

# TUN 接口名。Linux/Windows/FreeBSD 可指定;macOS 的 utun* 由系统分配,
# 此字段会被忽略。
interface = "mesh0"

# 更直观的接口名写法,tun.name 优先于 ingress.interface。
[tun]
# name = "mesh0"

# ---------------------------------------------------------------------------
# 日志
# ---------------------------------------------------------------------------

[log]
# 日志级别:debug / info / warn / error。
level = "info"

# 日志格式:console(开发) / json(生产)。
format = "console"

# ---------------------------------------------------------------------------
# 内嵌 [cli] 块
# ---------------------------------------------------------------------------
# 优先级高于文件字段,低于环境变量与命令行。
# 适合把"生产环境该怎么跑"随配置一起版本化。
#
# [cli]
# log = "debug"
